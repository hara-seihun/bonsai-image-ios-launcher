name: Build launcher
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BonsaiImageLauncher
          path: build/BonsaiImageLauncher.ipa
